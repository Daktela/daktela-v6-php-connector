name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

# The connector supports Guzzle 7 and Guzzle 8. Composer installs only one of them, so every job runs once per
# major version: `--with` narrows the guzzlehttp/guzzle constraint of composer.json for the job, and
# guzzlehttp/psr7 follows (Guzzle 7 uses PSR-7 2.x, Guzzle 8 uses PSR-7 3.x).

jobs:
  test:
    name: PHP ${{ matrix.php-version }}, Guzzle ${{ matrix.guzzle }}${{ matrix.dependencies == 'lowest' && ', lowest dependencies' || '' }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '8.0'
          - '8.1'
          - '8.2'
          - '8.3'
          - '8.4'
          - '8.5'
        guzzle:
          - '7'
          - '8'
        dependencies:
          - 'highest'
        include:
          # The lowest versions composer.json allows, e.g. Guzzle 7.15.2 and Guzzle 8.0.1
          - php-version: '8.0'
            guzzle: '7'
            dependencies: 'lowest'
          - php-version: '8.0'
            guzzle: '8'
            dependencies: 'lowest'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction ${{ matrix.dependencies == 'lowest' && '--prefer-lowest' || '' }} --with "guzzlehttp/guzzle:^${{ matrix.guzzle }}"

      - name: Show Guzzle versions
        run: composer show 'guzzlehttp/*'

      - name: Run PHPUnit tests
        run: vendor/bin/phpunit --configuration phpunit.dist.xml

  coverage:
    name: Coverage, Guzzle ${{ matrix.guzzle }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        guzzle:
          - '7'
          - '8'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          extensions: mbstring
          coverage: xdebug

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction --with "guzzlehttp/guzzle:^${{ matrix.guzzle }}"

      - name: Generate unit-test coverage
        run: vendor/bin/phpunit --configuration phpunit.dist.xml --testsuite Unit --coverage-clover coverage.xml

      - name: Enforce coverage threshold
        run: php tests/Support/check-coverage.php coverage.xml 90

  static-analysis:
    name: PHPStan, Guzzle ${{ matrix.guzzle }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        guzzle:
          - '7'
          - '8'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          extensions: mbstring
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction --with "guzzlehttp/guzzle:^${{ matrix.guzzle }}"

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress

  coding-standard:
    name: Composer validate and coding standard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          extensions: mbstring
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: Run PHP_CodeSniffer
        run: vendor/bin/phpcs
